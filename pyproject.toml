[project]
name = "hybrid-sequence-models-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv:2603.08859"
requires-python = ">=3.12,<3.13"
dependencies = [
  "marimo>=0.16,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "torch>=2.7,<3",
  "transformers>=4.53,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
